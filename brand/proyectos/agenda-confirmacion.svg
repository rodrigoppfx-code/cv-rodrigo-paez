ext x="537" y="234" fill="#111314" font-size="17" font-weight="600" font-family="Arial, sans-serif">Personalización</text><text x="537" y="262" fill="#4b5052" font-size="13" font-weight="400" font-family="Arial, sans-serif">Vídeo con IA</text><text x="746" y="265" fill="#4b5052" font-size="19" font-weight="400" font-family="Arial, sans-serif">→</text><rect x="761" y="204" width="220" height="106" rx="8" fill="#fff" stroke="#e0e4e0"/><text x="779" y="234" fill="#111314" font-size="17" font-weight="600" font-family="Arial, sans-serif">Envío</text><text x="779" y="262" fill="#4b5052" font-size="13" font-weight="400" font-family="Arial, sans-serif">Correo de confirmación</text><rect x="35" y="343" width="438" height="210" rx="8" fill="#fff" stroke="#e0e4e0"/><text x="58" y="381" fill="#111314" font-size="20" font-weight="600" font-family="Arial, sans-serif">Confirmación de ejemplo</text><text x="58" y="419" fill="#4b5052" font-size="15" font-weight="400" font-family="Arial, sans-serif">Hola, persona de demostración.</text><text x="58" y="453" fill="#4b5052" font-size="14" font-weight="400" font-family="Arial, sans-serif">Aquí encontrarías los detalles de la reunión</text><text x="58" y="480" fill="#4b5052" font-size="14" font-weight="400" font-family="Arial, sans-serif">y el vídeo personalizado.</text><rect x="501" y="343" width="463" height="210" rx="8" fill="#eaf0e7" stroke="none"/><rect x="523" y="365" width="419" height="125" rx="8" fill="#dce7d6" stroke="none"/><text x="708" y="441" fill="#365542" font-size="32" font-weight="400" font-family="Arial, sans-serif">▶</text><text x="526" y="525" fill="#4b5052" font-size="13" font-weight="400" font-family="Arial, sans-serif">Vista ilustrativa del vídeo · No se reproduce</text><rect x="0" y="594" width="1000" height="46" rx="0" fill="#ffffff" stroke="none"/><text x="30" y="622" fill="#4b5052" font-size="13" font-weight="400" font-family="Arial, sans-serif">Maqueta ilustrativa · Datos ficticios · Sin conexión a sistemas reales</text></svg>
