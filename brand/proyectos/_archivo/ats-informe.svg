<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title"><title id="title">Analizador de CV: informe ficticio de recomendaciones</title><rect x="0" y="0" width="1000" height="640" rx="0" fill="#f4f5f2" stroke="none"/><rect x="0" y="0" width="1000" height="66" rx="0" fill="#ffffff" stroke="none"/><text x="30" y="40" fill="#111314" font-size="20" font-weight="600" font-family="Arial, sans-serif">Analizador de CV con IA</text><text x="30" y="94" fill="#4b5052" font-size="13" font-weight="400" font-family="Arial, sans-serif">Informe de recomendaciones de ejemplo</text><rect x="764" y="18" width="202" height="30" rx="8" fill="#eef3ed" stroke="none"/><text x="776" y="38" fill="#365542" font-size="12" font-weight="600" font-family="Arial, sans-serif">DEMO ILUSTRATIVA</text><path d="M0 66h1000" stroke="#e0e4e0"/><rect x="27" y="122" width="293" height="440" rx="8" fill="#fff" stroke="#e0e4e0"/><text x="49" y="161" fill="#111314" font-size="19" font-weight="600" font-family="Arial, sans-serif">Contenido del informe</text><text x="49" y="233" fill="#4b5052" font-size="15" font-weight="400" font-family="Arial, sans-serif">Ajuste al cargo</text><text x="49" y="292" fill="#4b5052" font-size="15" font-weight="400" font-family="Arial, sans-serif">Competencias</text><text x="49" y="351" fill="#4b5052" font-size="15" font-weight="400" font-family="Arial, sans-serif">Palabras clave</text><text x="49" y="410" fill="#4b5052" font-size="15" font-weight="400" font-family="Arial, sans-serif">Recomendaciones</text><rect x="347" y="122" width="627" height="440" rx="8" fill="#fff" stroke="#e0e4e0"/><text x="371" y="163" fill="#111314" font-size="24" font-weight="600" font-family="Arial, sans-serif">Recomendaciones orientadas a ATS</text><text x="371" y="197" fill="#4b5052" font-size="13" font-weight="400" font-family="Arial, sans-serif">Ejemplo ficticio · Sin análisis de una persona real</text><rect x="371" y="229" width="579" height="77" rx="8" fill="#f4f5f2" stroke="none"/><text x="390" y="259" fill="#111314" font-size="16" font-weight="600" font-family="Arial, sans-serif">Claridad del perfil</text><text x="390" y="286" fill="#4b5052" font-size="13" font-weight="400" font-family="Arial, sans-serif">Relacionar la experiencia con el cargo objetivo.</text><rect x="371" y="321" width="579" height="77" rx="8" fill="#f4f5f2" stroke="none"/><text x="390" y="351" fill="#111314" font-size="16" font-weight="600" font-family="Arial, sans-serif">Competencias relevantes</text><text x="390" y="378" fill="#4b5052" font-size="13" font-weight="400" font-family="Arial, sans-serif">Revisar las palabras clave respaldadas por experiencia.</text><rect x="371" y="413" width="579" height="77" rx="8" fill="#f4f5f2" stroke="none"/><text x="390" y="443" fill="#111314" font-size="16" font-weight="600" font-family="Arial, sans-serif">Organización del documento</text><text x="390" y="470" fill="#4b5052" font-size="13" font-weight="400" font-family="Arial, sans-serif">Presentar la información de forma clara y legible.</text><rect x="371" y="524" width="203" height="30" rx="8" fill="#eef3ed" stroke="none"/><text x="383" y="544" fill="#365542" font-size="12" font-weight="600" font-family="Arial, sans-serif">Reportes PDF y Word</text><rect x="0" y="594" width="1000" height="46" rx="0" fill="#ffffff" stroke="none"/><text x="30" y="622" fill="#4b5052" font-size="13" font-weight="400" font-family="Arial, sans-serif">Maqueta ilustrativa · Datos ficticios · Sin conexión a sistemas reales</text></svg>
