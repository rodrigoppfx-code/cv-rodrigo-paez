<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video de presentación · Rodrigo Páez Parra</title>
<meta name="robots" content="noindex">
<meta name="description" content="Video de presentación de Rodrigo Páez Parra. Ingeniero Industrial y Magíster en Administración Internacional.">
<meta property="og:title" content="Video de presentación · Rodrigo Páez Parra">
<meta property="og:description" content="Ingeniero Industrial y Magíster en Administración Internacional. Si buscas a alguien que sume a tu equipo, conversemos.">
<meta property="og:image" content="https://rodrigo-paez-parra.vercel.app/brand/video/presentacion-portada.webp">
<meta property="og:url" content="https://rodrigo-paez-parra.vercel.app/presentacion">
<meta property="og:type" content="video.other">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F6;--bg2:#F3F1EB;--tx:#111314;--tx2:#4B5052;--tx3:#6B6F71;--bd:rgba(11,11,12,.12);--bd2:rgba(11,11,12,.3);--red:#B8230F;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{min-height:100svh;max-width:1180px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:clamp(18px,3vw,30px)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.brand{font:400 22px/1 'Instrument Serif',Georgia,serif;letter-spacing:-.01em}
.tag{font:600 11px/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.stage{position:relative;width:100%;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--bd),0 40px 80px -40px rgba(17,19,20,.55);animation:up .9s var(--ease) both}
.stage video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000}
.stage.v{max-width:430px;margin:0 auto}
.stage.v video{aspect-ratio:9/16}
.sound{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;align-items:center;gap:12px;min-height:54px;padding:0 24px 0 10px;border:0;border-radius:999px;background:rgba(17,19,20,.86);color:#fff;font:600 12px/1 Inter;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;cursor:pointer;backdrop-filter:blur(6px)}
.sound i{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--red);font-style:normal;font-size:14px}
.sound.on{display:inline-flex}
.sound:hover i{transform:scale(1.08)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 28px;animation:up .9s var(--ease) .2s both}
.who{display:flex;flex-direction:column;gap:6px}
.who b{font:400 clamp(26px,3vw,36px)/1.05 'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.015em}
.who span{font:400 14.5px/1.45 Inter;color:var(--tx2)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--tx);font:600 11.5px/1 Inter;letter-spacing:.12em;text-transform:uppercase;transition:background .25s,color .25s,border-color .25s,transform .35s var(--ease)}
.btn.main{background:var(--tx);color:var(--bg)}
.btn.main:hover{background:var(--red);border-color:var(--red);color:#fff;transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--bd2)}
.btn.ghost:hover{border-color:var(--red);color:var(--red)}
.btn .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.btn.main:hover .dot{background:#fff}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:560px){.btns{width:100%}.btn{flex:1 1 auto}}
@media (prefers-reduced-motion:reduce){.stage,.foot{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="index.html">Rodrigo Páez Parra</a>
    <span class="tag">Video de presentación</span>
  </header>

  <div class="stage" id="stage">
    <video id="vid" controls playsinline preload="auto" poster="brand/video/presentacion-portada.webp">
      <source id="src" src="brand/video/presentacion.mp4" type="video/mp4">
    </video>
    <button class="sound" id="sound" type="button"><i aria-hidden="true">♪</i>Activar sonido</button>
  </div>

  <div class="foot">
    <div class="who">
      <b>Si buscas a alguien que sume a tu equipo, conversemos.</b>
      <span>Ingeniero Industrial · Magíster en Administración Internacional</span>
    </div>
    <div class="btns">
      <a class="btn ghost" href="index.html">Ver hoja de vida</a>
      <a class="btn main" href="contacto.html"><span class="dot" aria-hidden="true"></span>Conversemos</a>
    </div>
  </div>
</div>
<script>
(function () {
  var vid = document.getElementById('vid'), stage = document.getElementById('stage'), btn = document.getElementById('sound');
  // En celular vertical se usa la versión 9:16
  if (matchMedia('(max-width:760px) and (orientation:portrait)').matches) {
    stage.classList.add('v');
    vid.poster = 'brand/video/presentacion-portada-vertical.webp';
    document.getElementById('src').src = 'brand/video/presentacion-vertical.mp4';
    vid.load();
  }
  // Intenta reproducir con sonido; si el navegador no lo permite, arranca sin sonido y ofrece activarlo
  var p = vid.play();
  if (p && p.catch) p.catch(function () {
    vid.muted = true;
    var q = vid.play(); if (q && q.catch) q.catch(function () {});
    btn.classList.add('on');
  });
  btn.addEventListener('click', function () { vid.muted = false; vid.currentTime = 0; vid.play(); btn.classList.remove('on'); });
  vid.addEventListener('volumechange', function () { if (!vid.muted) btn.classList.remove('on'); });
})();
</script>
</body>
</html>
